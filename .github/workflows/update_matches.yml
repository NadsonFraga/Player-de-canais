name: Update Match Schedule

on:
  schedule:
    # A cada 5 minutos no horário de jogos (11h às 00h59 BRT = 14h às 03h59 UTC)
    - cron: '*/5 14-23,0-3 * * *'
    # A cada 1 hora de madrugada e início de manhã (01h às 10h59 BRT = 04h às 13h59 UTC)
    - cron: '0 4-13 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute match extraction script
        run: python scripts/test_get_matches.py

      - name: Commit and push updated match schedule
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add proximos_jogos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update match schedule [skip ci]" && git push)

