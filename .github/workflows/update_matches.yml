name: Update Match Schedule

on:
  schedule:
    # Runs every 5 minutes continuously (unlimited for public repositories)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute match extraction script
        run: python tools/test_get_matches.py

      - name: Publish match schedule to data branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          cp data/proximos_jogos.json /tmp/proximos_jogos.json
          git checkout --orphan data-temp
          git rm -rf .
          cp /tmp/proximos_jogos.json proximos_jogos.json
          git add proximos_jogos.json
          git commit -m "chore: update match schedule [skip ci]"
          git push -f origin data-temp:data

