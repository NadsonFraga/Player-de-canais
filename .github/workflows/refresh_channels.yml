name: Refresh Live Channel Tokens

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to ensure tokens never expire
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual on-demand trigger from the GitHub Actions tab

jobs:
  refresh-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Extract live stream tokens
        run: python tools/extract_channel_stream.py --all

      - name: Commit and publish updated tokens to master
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/canais.json assets/js/core/fallbackChannels.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(channels): refresh live channel stream tokens [automated]"
            git push origin master
          else
            echo "All channel stream tokens are already fresh."
          fi
